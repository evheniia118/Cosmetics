{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<div class="auth-box">
    <h2>{% trans "Register" %}</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>{% trans "Username" %}:</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>{% trans "Password" %}:</label>
            {{ form.password1 }}
        </div>

        <div class="form-group">
            <label>{% trans "Confirm password" %}:</label>
            {{ form.password2 }}
        </div>

        <button type="submit" class="btn">
            {% trans "Register" %}
        </button>
    </form>

</div>

{% endblock %}
