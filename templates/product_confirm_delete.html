{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<h2 style="text-align:center;">{% trans "Confirm deletion" %}</h2>

<div style="text-align:center; margin-top: 30px;">

    <p>
        {% blocktrans %}Are you sure you want to delete "{{ product.name }}"?{% endblocktrans %}
    </p>

    <form method="post" style="margin-top:20px;">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color:#ff4d6d;">
            {% trans "Yes, delete" %}
        </button>
    </form>

    <br>

    <a href="/product/{{ product.id }}/" class="btn">
        {% trans "Cancel" %}
    </a>

</div>

{% endblock %}
