{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<div class="auth-box">
    <h2>{% trans "Change password" %}</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>{% trans "Old password" %}:</label>
            {{ form.old_password }}
        </div>

        <div class="form-group">
            <label>{% trans "New password" %}:</label>
            {{ form.new_password1 }}
        </div>

        <div class="form-group">
            <label>{% trans "Confirm password" %}:</label>
            {{ form.new_password2 }}
        </div>

        <button type="submit">{% trans "Change password" %}</button>
    </form>

</div>

{% endblock %}
