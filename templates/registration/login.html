{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<div class="auth-box">
    <h2>{% trans "Login" %}</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>{% trans "Username" %}:</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>{% trans "Password" %}:</label>
            {{ form.password }}
        </div>

        <button type="submit">{% trans "Login" %}</button>
    </form>

    {% if form.errors %}
        <p style="color:red;">
            {% trans "Invalid username or password" %}
        </p>
    {% endif %}
</div>

{% endblock %}
